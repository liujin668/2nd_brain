<polyline points="350,295 350,365 440,365" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polygon points="440.00,365.00 430.00,360.50 430.00,369.50" fill="#3c6278"/>
<circle cx="350" cy="295" r="3.5" fill="#3c6278"/>
<polyline points="315,295 315,530 440,530" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polygon points="440.00,530.00 430.00,525.50 430.00,534.50" fill="#3c6278"/>
<circle cx="315" cy="295" r="3.5" fill="#3c6278"/>
<text x="324" y="491" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#647985">实际输入</text>
<polyline points="790,232 885,232 885,270 920,270" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polygon points="920.00,270.00 910.00,265.50 910.00,274.50" fill="#3c6278"/>
<polyline points="790,365 885,365 885,325 920,325" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polygon points="920.00,325.00 910.00,320.50 910.00,329.50" fill="#3c6278"/>
<polyline points="1100,275 1210,275" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polygon points="1210.00,275.00 1200.00,270.50 1200.00,279.50" fill="#3c6278"/>
<text x="1155" y="252" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#647985">实际输出</text>
<polyline points="790,530 1160,530 1160,330 1210,330" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polygon points="1210.00,330.00 1200.00,325.50 1200.00,334.50" fill="#3c6278"/>
<text x="975" y="509" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#647985">期望输出 / 预期边沿</text>
<polyline points="1320,360 1320,455" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polygon points="1320.00,455.00 1324.50,445.00 1315.50,445.00" fill="#3c6278"/>
<text x="1334" y="408" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#647985">检查结果</text>
<text x="60" y="620" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#647985">注：各单元并列验证；毛刺、脉宽和切换规则按具体单元规格检查。</text>
</svg>