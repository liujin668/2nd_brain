<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
<title>逻辑门与时钟单元验证框图</title>
<desc>激励驱动并列的逻辑与时钟单元。参考模型使用实际输入产生期望结果，与监测输出比较。</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="750" y="43" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="32" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#213a49">逻辑门与时钟单元验证框图</text>
<rect x="390" y="115" width="460" height="325" rx="9" fill="white" stroke="#3c6278" stroke-width="1.8"/>
<text x="411" y="141" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" font-weight="600" text-anchor="start" dominant-baseline="central" fill="#213a49">DUT 边界 | 基本单元</text>
<rect x="440" y="180" width="350" height="105" rx="9" fill="#eef4f7" stroke="#3c6278" stroke-width="1.8"/>
<text x="615" y="205" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">组合逻辑单元</text>
<text x="615" y="239" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">AND / OR / XOR / NAND / NOR</text>
<text x="615" y="264" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">XNOR / MUX / BUF / INV</text>
<rect x="440" y="315" width="350" height="100" rx="9" fill="#eef4f7" stroke="#3c6278" stroke-width="1.8"/>
<text x="615" y="340" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">时钟单元</text>
<text x="615" y="373" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">CLK BUF / INV / AND / OR</text>
<text x="615" y="396" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">GATE / MUX</text>
<rect x="60" y="215" width="225" height="160" rx="9" fill="#eef4f7" stroke="#3c6278" stroke-width="1.8"/>
<text x="172.5" y="250" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">激励发生器</text>
<text x="172.5" y="296" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">穷举 / 随机逻辑向量</text>
<text x="172.5" y="331" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">时钟 / 使能 / 选择</text>
<rect x="920" y="230" width="180" height="130" rx="9" fill="#eef4f7" stroke="#3c6278" stroke-width="1.8"/>
<text x="1010" y="265" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">输出监测</text>
<text x="1010" y="307" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">数据 / 边沿</text>
<text x="1010" y="337" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">脉宽 / 时间戳</text>
<rect x="1210" y="230" width="220" height="130" rx="9" fill="#eef4f7" stroke="#3c6278" stroke-width="1.8"/>
<text x="1320" y="263" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">比对与检查</text>
<text x="1320" y="306" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">功能 / 时钟行为</text>
<text x="1320" y="337" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">Checker / SVA</text>
<rect x="440" y="475" width="350" height="110" rx="9" fill="#eef4f7" stroke="#3c6278" stroke-width="1.8"/>
<text x="615" y="503" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">参考模型</text>
<text x="615" y="540" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">逻辑真值表 / 时钟行为</text>
<text x="615" y="570" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">独立计算期望结果</text>
<rect x="1210" y="455" width="220" height="110" rx="9" fill="#eef4f7" stroke="#3c6278" stroke-width="1.8"/>
<text x="1320" y="485" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">结果与覆盖率</text>
<text x="1320" y="523" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">PASS / FAIL</text>
<text x="1320" y="551" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400" text-anchor="middle" dominant-baseline="central" fill="#213a49">日志 / 波形 / 覆盖率</text>
<polyline points="285,295 350,295" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="350,295 350,232 440,232" fill="none" stroke="#3c6278" stroke-width="1.9" stroke-linejoin="round"/>
